name: exp-cancel
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: cancel runs that were in flight while the PR was open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CUTOFF: ${{ github.event.pull_request.merged_at || github.event.pull_request.closed_at }}
          SELF: ${{ github.run_id }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          echo "sha=$SHA merged=$MERGED cutoff=$CUTOFF self=$SELF"
          echo "--- all pull_request runs on this sha ---"
          gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "pull_request") | "  \(.id) \(.status) created=\(.created_at) name=\(.name)"'
          echo "--- selected for cancellation ---"
          gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            | jq -r --arg cutoff "$CUTOFF" --argjson self "$SELF" '
              .workflow_runs[]
              | select(.event == "pull_request")
              | select(.status == "queued" or .status == "in_progress")
              | select(.created_at < $cutoff)
              | select(.id != $self)
              | .id' > /tmp/ids.txt
          cat /tmp/ids.txt
          while read -r id; do
            [ -z "${id:-}" ] && continue
            echo "cancelling $id"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null || echo "cancel failed for $id"
          done < /tmp/ids.txt
          echo "done"
