# Experiment: duplicate check names. Job is deliberately named `check`, the same
# as exp-beta.yml, to see how a single required context named `check` resolves
# when two workflows both publish it. Outcome is driven by exp/alpha.txt so a PR
# can choose pass/fail without editing the workflow. Finishes FIRST (short sleep).
name: exp-alpha

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settle ordering
        run: sleep 5
      - name: Outcome from exp/alpha.txt
        run: |
          want=$(cat exp/alpha.txt 2>/dev/null || echo pass)
          echo "alpha wants: $want"
          [[ "$want" == "pass" ]]
