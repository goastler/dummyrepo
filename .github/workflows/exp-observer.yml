name: exp-observer
on:
  pull_request:
    types: [closed]
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "pr=${{ github.event.pull_request.number }}"
          echo "base=${{ github.event.pull_request.base.ref }}"
          echo "merged=${{ github.event.pull_request.merged }}"
