# Experiment: re-run semantics for a computed runner choice (todo 003, option B).
# `setup` reads the PR's labels LIVE from the API rather than from the frozen
# event payload, and publishes the choice as a job output. `consume` is made to
# fail on demand so we can compare "Re-run failed jobs" against "Re-run all jobs"
# after changing a label.
name: exp-rerun

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      seen: ${{ steps.pick.outputs.seen }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/pulls/$PR" -q '.labels[].name' | sort | tr '\n' ',')
          echo "live labels: $labels"
          echo "seen=$labels" >> "$GITHUB_OUTPUT"
          if grep -q 'ci:hosted' <<<"$labels"; then
            echo "runner=HOSTED" >> "$GITHUB_OUTPUT"
          else
            echo "runner=SELFHOSTED" >> "$GITHUB_OUTPUT"
          fi
          echo "attempt ${{ github.run_attempt }}"

  consume:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report what setup decided
        env:
          RUNNER_CHOICE: ${{ needs.setup.outputs.runner }}
          SEEN: ${{ needs.setup.outputs.seen }}
        run: |
          echo "RUNNER_CHOICE=$RUNNER_CHOICE"
          echo "SEEN=$SEEN"
          echo "attempt=${{ github.run_attempt }}"
      - name: Outcome from exp/rerun.txt
        run: |
          want=$(cat exp/rerun.txt 2>/dev/null || echo pass)
          echo "rerun wants: $want"
          [[ "$want" == "pass" ]]
