# Experiment: does a job skipped by an `if:` still satisfy a required context?
# Mirrors the draft gate used across the captcha-private workflows.
name: exp-skip

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  skipjob:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - run: echo "skipjob ran — PR was not a draft"
